appId: io.github.inikolax.remiqora
productName: Remiqora
copyright: Copyright © 2026 Nikolay Cherkashin
directories:
  output: dist
  buildResources: build
publish: null

files:
  - src/**
  - renderer/**
  - manifest.json
  - package.json
  - "!**/*.map"

# The backend runs from real files (Python cannot import from an asar archive). Its own sibling layout is kept:
# resources/backend and resources/frontend/dist.
extraResources:
  - from: resources/backend
    to: backend
  - from: resources/frontend
    to: frontend
  - from: resources/patches
    to: patches

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: true            # per-user install, no administrator prompt
  perMachine: false
  deleteAppDataOnUninstall: false   # models and projects are the user's data, not ours to delete
  artifactName: Remiqora-Setup-${version}.${ext}
  shortcutName: Remiqora

mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.music
  icon: build/icon.png
  # Ad-hoc signature (no certificate needed). With "null" nothing is signed, and an unsigned arm64 app is reported
  # as "damaged". Ad-hoc signing needs hardenedRuntime off, otherwise library validation rejects Electron's
  # frameworks. Replace both when an Apple Developer ID and notarization are set up.
  identity: "-"
  hardenedRuntime: false
  artifactName: Remiqora-${version}-${arch}.${ext}

# Packaging works; the first-run setup reports "unsupported" on Linux until it has scripts (see PR #2).
linux:
  target: [AppImage]
  category: AudioVideo
  icon: build/icon.png
  artifactName: Remiqora-${version}-${arch}.${ext}
