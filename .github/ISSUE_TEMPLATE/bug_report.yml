name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Issues can be written in English or Russian.
        For questions and "how do I…", please use [Discussions](https://github.com/inikolax/remiqora/discussions) instead.
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - ACE-Step generation
        - YuE2 generation
        - Stem separation (Demucs)
        - MIDI transcription (MuScriptor)
        - SheetSage2
        - LoRA training
        - Editor / DAW
        - Install / setup scripts
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10/11
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (not officially supported)
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: GPU / chip and memory
      placeholder: "e.g. RTX 4080 16 GB, or MacBook Air M5 24 GB"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Remiqora version
      description: The commit you are on — run `git rev-parse --short HEAD` in the repository folder.
      placeholder: "e.g. 10107d1"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant terminal output, or files from `backend/logs/` (e.g. `ace_step_api.log`). Please trim to the relevant part.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and didn't find this one.
          required: true
